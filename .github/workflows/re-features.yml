name: re-features
# scope: fork-only — manual one-off data repair experiment
# One-off data repair: recompute every entry's `features` under the
# Host.resolve-aligned rules (classification logic changed; dormant packages
# never hit the version-bump rescan path). npm packument fetches only —
# zero api.github.com calls, so the hourly token budget is untouched.
on:
  workflow_dispatch:
concurrency: catalog-branch   # same mutex as catalog.yml/verify.yml — serializes catalog writers
permissions: {}
jobs:
  recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4        # main — pipeline sources
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: recompute features on catalog branch (retry on writer race)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "market-bot@users.noreply.github.com"
          git config user.name "market-bot"
          git fetch origin catalog
          git worktree add /tmp/cat origin/catalog
          ok=0
          for i in 1 2 3; do
            git -C /tmp/cat reset --hard origin/catalog
            # re-run on the fresh base each retry — the script is idempotent
            npx tsx pipeline/re-features.ts /tmp/cat/index.json
            git -C /tmp/cat add index.json
            git -C /tmp/cat commit -m "features: recompute under Host.resolve-aligned rules (run ${GITHUB_RUN_ID})" || { ok=1; break; }
            git -C /tmp/cat push origin HEAD:catalog && { ok=1; break; }
            echo "push rejected (attempt $i) — retrying on fresh remote head"
            git fetch origin catalog
          done
          [ "$ok" = 1 ] || { echo "catalog push failed after retries"; exit 1; }

  # single Pages publisher — site.yml via workflow_call gets the skill cache,
  # deploy gate and alert job for free; an inline copy drifted out of all three
  site:
    needs: recompute
    permissions: { pages: write, id-token: write, contents: read, actions: write, issues: write }   # called workflow's perms are capped by this grant — site.yml needs actions (cache prune) + issues (failure alert) too
    uses: ./.github/workflows/site.yml
