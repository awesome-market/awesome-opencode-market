name: site
# scope: prod-only — Pages publisher dispatched by catalog/verify writes
# The single Pages publisher (V-8): both catalog-branch writers (catalog.yml
# publish, verify.yml merge) dispatch this after their push lands, instead of
# each building+deploying their own copy. Bot pushes can't trigger `on: push`
# (GITHUB_TOKEN events never start workflows), so dispatch is the only channel.
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'bypass the deploy gate (shrink/skill-degraded checks) — emergency republish only'
        type: boolean
        default: false
      skip_skills:
        description: 'publish catalog without fetching skill tarballs (registry/CDN outage escape hatch)'
        type: boolean
        default: false
  workflow_call:      # other pipelines (re-features) reuse this instead of copying the deploy block — one publisher, one gate
    inputs:
      force: { type: boolean, default: false }
      skip_skills: { type: boolean, default: false }
concurrency: site-deploy
permissions: {}
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # cold skill fetches are pooled but bounded — a hung npm/curl must not hold the 6h default
    permissions: { pages: write, id-token: write, contents: read, actions: write }   # actions: prune stale skill-cache entries
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Deliberately NO harden-runner egress block on this job: upload/download
    # of the Pages artifact talks to dynamic action-runtime endpoints that
    # cannot be allowlisted (same posture as submit.yml's report job). The
    # untrusted-fetch half is still bounded — packument reads are byte-capped,
    # tarball curls are https-pinned + size-capped + SRI-checked, and the
    # tarball URL comes from the live packument, not catalog data.
    steps:
      # B-5: site always builds from the catalog branch's current index —
      # never from a possibly-stale artifact produced hours earlier.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: |
          # --depth=1: only FETCH_HEAD tip files are read (index/verdicts) —
          # a full-history fetch would download every catalog commit's index
          # snapshot each deploy and grow without bound (docket.yml precedent)
          git fetch --depth=1 origin catalog
          # FETCH_HEAD = the ref we just fetched — immune to opportunistic
          # remote-tracking updates (origin/catalog could lag a failed fetch)
          git show FETCH_HEAD:index.json > index.json
          # health.json.commit must name the CATALOG commit that produced
          # index.json — github.sha is the code ref (main HEAD on dispatch),
          # an unrelated provenance stamp on the publish manifest.
          echo "SITE_COMMIT=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
          # verdict audit surface for detail pages. cat-file -e splits the
          # two failure modes the old `|| touch` conflated: path absent on the
          # catalog branch = legitimately "no verdicts yet" (empty file);
          # path present but git show failing = real fetch corruption → the
          # step's -e aborts the deploy rather than publishing a silently
          # empty audit surface.
          if git cat-file -e "FETCH_HEAD:ai-verdicts.jsonl" 2>/dev/null; then
            git show FETCH_HEAD:ai-verdicts.jsonl > ai-verdicts.jsonl
          else
            : > ai-verdicts.jsonl
          fi
          # the redirection above creates the file even when git show fails —
          # check content like catalog.yml's WF-1 rule instead of letting a
          # bare JSON.parse error stand in for "fetch failed"
          if [ ! -s index.json ]; then
            echo "::error::catalog index.json missing or empty — refusing to build"
            exit 1
          fi
      # S-1: extracted skill docs are version-pinned — cache by <id>@<pin> so
      # unchanged skills cost zero network on redeploys (rolling cache key;
      # the build prunes entries no longer referenced). Keys are per-run, so a
      # final step trims the repo's 10GB cache back to the newest few.
      - uses: actions/cache@v4
        with:
          path: .skill-cache
          key: skill-cache-${{ github.run_id }}
          restore-keys: skill-cache-
      # absolute Pages origin + base path — an org/user page repo (named
      # <owner>.github.io) serves from the origin itself, a project repo from
      # /<name>; derived here so forks and org pages both stay correct.
      # SITE_URL feeds the skills-catalog usage snippet and the deploy gate's
      # live-health probe; SITE_BASE feeds 404.html's absolute links.
      - name: derive SITE_URL / SITE_BASE
        run: |
          NAME="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$NAME" = "$OWNER.github.io" ]; then
            echo "SITE_URL=https://$OWNER.github.io" >> "$GITHUB_ENV"
            echo "SITE_BASE=/" >> "$GITHUB_ENV"
          else
            echo "SITE_URL=https://$OWNER.github.io/$NAME" >> "$GITHUB_ENV"
            echo "SITE_BASE=/$NAME/" >> "$GITHUB_ENV"
          fi
      - run: npx tsx pipeline/site/build.ts index.json /tmp/site ai-verdicts.jsonl
        env:
          SKILL_CACHE: .skill-cache
          SKIP_SKILLS: ${{ inputs.skip_skills }}
          # SITE_COMMIT (catalog sha) comes from GITHUB_ENV via the fetch
          # step above; SITE_BASE/SITE_URL likewise (derive step) — an
          # org-page repo must not inherit a /repo/ base it doesn't serve
      # S-3: deploy gate — an empty/broken catalog published is worse than a
      # stale one. Compare against the LIVE site's health.json; if that fetch
      # fails the absolute floor still applies (never gate on network flakiness).
      - name: deploy gate — refuse a catastrophically shrunken catalog
        env:
          SITE_FLOOR: ${{ vars.SITE_FLOOR }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then echo "deploy gate: skipped (force dispatch)"; exit 0; fi
          # SITE_URL (derived above) already encodes the org-page-vs-project
          # distinction — a hardcoded owner.github.io/<repo> would 404 a
          # user/org page and silently degrade every deploy to floor-only
          curl -fsSL --max-time 15 "$SITE_URL/health.json" -o /tmp/prev-health.json \
            || echo '{"entries":null}' > /tmp/prev-health.json
          npx tsx -e "
            import {readFileSync, appendFileSync} from 'node:fs';
            import {healthGate} from './pipeline/site/build.ts';
            let prev;
            try { prev = JSON.parse(readFileSync('/tmp/prev-health.json','utf8')) }
            catch { prev = { entries: null } }   // corrupt live health → degrade to floor-only, like a fetch failure
            // explicit parse — '0' is a valid floor (small curated catalog);
            // only unset/non-numeric falls back to 200
            const floor = process.env.SITE_FLOOR && Number.isFinite(Number(process.env.SITE_FLOOR)) ? Number(process.env.SITE_FLOOR) : 200;
            const msg = healthGate(prev, JSON.parse(readFileSync('/tmp/site/health.json','utf8')), floor);
            if (msg) {
              console.error('deploy gate: '+msg);
              // the alert issue only links the run — put the actual reason in
              // the step summary so triage doesn't require digging logs
              if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'deploy gate refused: ' + msg + '\n');
              process.exit(1)
            }
            console.log('deploy gate: ok')
          "
      - uses: actions/upload-pages-artifact@v3
        with: { path: /tmp/site }
      - uses: actions/deploy-pages@v4
        id: deploy
      # per-run cache keys accumulate one full snapshot per deploy — keep the
      # newest 3, let the rest go (also runs on failure so a broken build
      # doesn't strand its cache either)
      - name: prune stale skill caches
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache list --key "skill-cache-" --limit 100 --json id,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].id' \
            | while read -r id; do gh cache delete "$id" >/dev/null 2>&1 || true; done

  alert:
    needs: site
    # cancelled counts too: the documented worst case is a cold skill cache
    # mass-bump hitting the 30min job cap — a cancelled deploy leaves the live
    # site silently stale, which is exactly what this job exists to report
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    permissions: { issues: write }
    steps:
      # gh api only — same egress posture as every other alert job
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: api.github.com:443
      - name: open (or append to) failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # S-6: dedupe — a failing deploy streak comments on the one open
          # alert instead of spawning an issue per run (same rule as the
          # digest watchdog).
          gh label create pipeline-alert --color d93f0b --force 2>/dev/null || true
          # in:title — an unrelated open issue merely mentioning the phrase in
          # its body must not become the append target (digest.yml precedent)
          EXISTING=$(gh issue list --repo "$GH_REPO" --label pipeline-alert --state open --search "site workflow failed in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GH_REPO" --body "Failed again: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            gh issue create --repo "$GH_REPO" \
              --title "site workflow failed (run ${GITHUB_RUN_ID})" \
              --body "Automated alert: the site deploy workflow failed."$'\n\n'"Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --label "pipeline-alert"
          fi
