name: site
# scope: prod-only — Pages publisher dispatched by catalog/verify writes
# The single Pages publisher (V-8): both catalog-branch writers (catalog.yml
# publish, verify.yml merge) dispatch this after their push lands, instead of
# each building+deploying their own copy. Bot pushes can't trigger `on: push`
# (GITHUB_TOKEN events never start workflows), so dispatch is the only channel.
on:
  workflow_dispatch:
  workflow_call:      # other pipelines (re-features) reuse this instead of copying the deploy block — one publisher, one gate
concurrency: site-deploy
permissions: {}
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # cold skill fetches are pooled but bounded — a hung npm/curl must not hold the 6h default
    permissions: { pages: write, id-token: write, contents: read }
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # B-5: site always builds from the catalog branch's current index —
      # never from a possibly-stale artifact produced hours earlier.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: |
          git fetch origin catalog
          git show origin/catalog:index.json > index.json
          # verdict audit surface for detail pages — absent file just means
          # "no verdicts yet" (loadVerdicts tolerates missing paths)
          git show origin/catalog:ai-verdicts.jsonl > ai-verdicts.jsonl 2>/dev/null || touch ai-verdicts.jsonl
          # the redirection above creates the file even when git show fails —
          # check content like catalog.yml's WF-1 rule instead of letting a
          # bare JSON.parse error stand in for "fetch failed"
          if [ ! -s index.json ]; then
            echo "::error::catalog index.json missing or empty — refusing to build"
            exit 1
          fi
      # S-1: extracted skill docs are version-pinned — cache by <id>@<ver> so
      # unchanged skills cost zero network on redeploys (rolling cache key;
      # the build prunes entries no longer referenced).
      - uses: actions/cache@v4
        with:
          path: .skill-cache
          key: skill-cache-${{ github.run_id }}
          restore-keys: skill-cache-
      - run: npx tsx pipeline/site/build.ts index.json /tmp/site ai-verdicts.jsonl
        env:
          SKILL_CACHE: .skill-cache
          # absolute base path for 404.html links — served at arbitrary depth
          SITE_BASE: /${{ github.event.repository.name }}/
      # S-3: deploy gate — an empty/broken catalog published is worse than a
      # stale one. Compare against the LIVE site's health.json; if that fetch
      # fails the absolute floor still applies (never gate on network flakiness).
      - name: deploy gate — refuse a catastrophically shrunken catalog
        run: |
          curl -fsSL --max-time 15 "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/health.json" -o /tmp/prev-health.json \
            || echo '{"entries":null}' > /tmp/prev-health.json
          npx tsx -e "
            import {readFileSync} from 'node:fs';
            import {healthGate} from './pipeline/site/build.ts';
            let prev;
            try { prev = JSON.parse(readFileSync('/tmp/prev-health.json','utf8')) }
            catch { prev = { entries: null } }   // corrupt live health → degrade to floor-only, like a fetch failure
            const floor = Number(process.env.SITE_FLOOR) || 200;
            const msg = healthGate(prev, JSON.parse(readFileSync('/tmp/site/health.json','utf8')), floor);
            if (msg) { console.error('deploy gate: '+msg); process.exit(1) }
            console.log('deploy gate: ok')
          "
      - uses: actions/upload-pages-artifact@v3
        with: { path: /tmp/site }
      - uses: actions/deploy-pages@v4
        id: deploy

  alert:
    needs: site
    if: failure()
    runs-on: ubuntu-latest
    permissions: { issues: write }
    steps:
      - name: open (or append to) failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # S-6: dedupe — a failing deploy streak comments on the one open
          # alert instead of spawning an issue per run (same rule as the
          # digest watchdog).
          gh label create pipeline-alert --color d93f0b --force 2>/dev/null || true
          EXISTING=$(gh issue list --repo "$GH_REPO" --label pipeline-alert --state open --search "site workflow failed" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GH_REPO" --body "Failed again: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            gh issue create --repo "$GH_REPO" \
              --title "site workflow failed (run ${GITHUB_RUN_ID})" \
              --body "Automated alert: the site deploy workflow failed."$'\n\n'"Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --label "pipeline-alert"
          fi
