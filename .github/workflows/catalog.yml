name: catalog
# scope: prod-only — scheduled catalog automation (fork runs produce the dev catalog)
on:
  schedule: [{ cron: '17 3 * * *' }, { cron: '0 11 * * *' }]
  workflow_dispatch:
permissions: {}               # job-level grants below
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name != 'schedule' || contains(fromJSON('["awesome-market","terry2010"]'), github.repository_owner)
    permissions: {}             # processes untrusted npm metadata — no write token (WF-3)
    # no concurrency lock: generate only READS the catalog branch — holding
    # catalog-branch for ~30-60min would block every verify/digest/ingest
    # merge behind a reader. Writers serialize on the publish job below (C-3).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: fetch old index + aux files (merge base)
        run: |
          # WF-1: distinguish "remote branch exists" (→ fetch MUST succeed and
          # index MUST be present+valid) from "first run ever" (branch absent).
          # A failed fetch or empty/corrupt index must hard-fail, never run blind.
          if git ls-remote --exit-code origin catalog >/dev/null 2>&1; then
            git fetch origin catalog
            git show origin/catalog:index.json > /tmp/old-index.json
            if [ ! -s /tmp/old-index.json ]; then
              echo "catalog branch exists but index.json is empty — refusing to run blind (WF-1)"
              exit 1
            fi
            npx tsx -e "import { CatalogIndex } from './src/schema.ts'; import { readFileSync } from 'node:fs'; CatalogIndex.parse(JSON.parse(readFileSync('/tmp/old-index.json','utf8'))); console.log('old index valid')"
            git show origin/catalog:submissions.txt > /tmp/submissions.txt 2>/dev/null || touch /tmp/submissions.txt
            # absent blocklist → optional, run without it; PRESENT-but-corrupt
            # must hard-fail inside run.ts (fail-open would silently unblock, C-4)
            git show origin/catalog:blocklist.json > /tmp/blocklist.json 2>/dev/null || rm -f /tmp/blocklist.json
            git show origin/catalog:ai-verdicts.jsonl > /tmp/ai-verdicts.jsonl 2>/dev/null || touch /tmp/ai-verdicts.jsonl
            # missing digest-state = -∞: all pass verdicts stay frozen until the
            # first daily digest publishes (fail-closed bootstrap, AI-DIAGNOSIS §4)
            git show origin/catalog:digest-state.json > /tmp/digest-state.json 2>/dev/null || rm -f /tmp/digest-state.json
          else
            touch /tmp/submissions.txt /tmp/ai-verdicts.jsonl   # first run ever — no blocklist yet (absent = disabled, not corrupt)
          fi
      - name: run pipeline
        env:
          # MARKET_PAT (optional, 5000 req/h) overrides the 1000 req/h GITHUB_TOKEN budget
          GH_TOKEN: ${{ secrets.MARKET_PAT || secrets.GITHUB_TOKEN }}
        run: npx tsx pipeline/run.ts --out /tmp/index.json --old /tmp/old-index.json --seed /tmp/submissions.txt --blocklist /tmp/blocklist.json --verdicts /tmp/ai-verdicts.jsonl --digest-state /tmp/digest-state.json --max 2000
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-out
          path: |
            /tmp/index.json
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    concurrency: catalog-branch   # writer lock shared with verify/digest/ingest — only the write phase holds it (C-3)
    permissions: { contents: write, issues: write, actions: write }   # contents+issues: catalog writer + submission notify (WF-3); actions: dispatches site.yml (V-8)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: catalog-out, path: /tmp }
      - name: commit index to catalog branch (re-merge + retry on race, WF-2)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.email "market-bot@users.noreply.github.com"
          git config user.name "market-bot"
          # catalog branch is data-only (no pipeline sources) — use a worktree so
          # the main checkout keeps pipeline/*.ts runnable throughout the loop.
          if git ls-remote --exit-code origin catalog >/dev/null 2>&1; then
            git fetch origin catalog
            git worktree add /tmp/cat origin/catalog
          else
            # first run ever: no catalog branch — create it as an ORPHAN so the
            # data-only branch never inherits the whole main source tree
            git worktree add --detach /tmp/cat
            git -C /tmp/cat checkout --orphan catalog
            git -C /tmp/cat rm -rf . >/dev/null 2>&1 || true
          fi
          ok=0
          RELEASE_FAILED=0
          for i in 1 2 3 4; do
            git fetch origin catalog 2>/dev/null || true
            git -C /tmp/cat reset --hard origin/catalog 2>/dev/null || true
            # race happened → re-merge our fresh scan against the fresh remote index
            # (preserves remote's verification/removed state instead of clobbering it)
            git show origin/catalog:index.json > /tmp/remote-index.json 2>/dev/null || true
            if [ -s /tmp/remote-index.json ]; then
              npx tsx pipeline/remerge.ts /tmp/index.json /tmp/remote-index.json > /tmp/index.merged.json
              mv /tmp/index.merged.json /tmp/index.json
            fi
            # catch-up verdict apply on the merged index: a human brake / new
            # verdict / digest announcement that landed BETWEEN generate's
            # fetch and this commit must not be clobbered by publishing our
            # stale snapshot over it — re-derive state from the freshest
            # remote jsonl + digest-state (idempotent; a brake that arrived
            # mid-run stays a brake, our own mature release still releases).
            if npx tsx pipeline/release.ts /tmp/index.json /tmp/cat/ai-verdicts.jsonl /tmp/cat/digest-state.json > /tmp/index.released.json; then
              mv /tmp/index.released.json /tmp/index.json
              RELEASE_FAILED=0
            else
              # non-fatal but tracked: a failed fold leaves brakes/releases
              # unapplied until the next run — the post-loop check below
              # turns a persistent failure into a pipeline-alert issue
              RELEASE_FAILED=1
              echo "::warning::release.ts failed during publish attempt $i — verdict apply skipped (next catalog run re-derives)"
            fi
            cp /tmp/index.json /tmp/cat/index.json
            git -C /tmp/cat add index.json
            # staged-diff precheck: distinguish "nothing to commit" (remote head
            # already carries this content → success) from a real commit failure,
            # which `commit || echo` would mask into a false-success push (C-2)
            if git -C /tmp/cat diff --cached --quiet; then
              echo "index unchanged vs remote head — nothing to publish"
              ok=1; break
            fi
            git -C /tmp/cat commit -m "catalog: $(date -u +%F) run ${GITHUB_RUN_ID}" || { echo "commit failed (attempt $i)"; continue; }
            git -C /tmp/cat push origin HEAD:catalog && { ok=1; break; }
            echo "push rejected (attempt $i) — re-fetching remote head and re-merging"
          done
          [ "$ok" = 1 ] || { echo "catalog publish failed after retries"; exit 1; }
          # G10: the publish succeeded but the verdict fold failed on the
          # last attempt — brakes/releases are deferred ~12h while the index
          # shows stale approval state. The workflow alert job can't see this
          # (publish itself was green), so file a deduped pipeline-alert.
          if [ "$RELEASE_FAILED" = 1 ]; then
            gh label create pipeline-alert --color d93f0b --force 2>/dev/null || true
            EXISTING=$(gh issue list --repo "$GH_REPO" --label pipeline-alert --state open --search "release apply failed" --json number --jq '.[0].number' 2>/dev/null || true)
            RBODY="catalog publish landed but \`pipeline/release.ts\` failed on the final attempt — mature verdicts (releases AND human brakes) are NOT applied to the published index until the next successful fold (~12h). Check the release.ts error in the run log: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --repo "$GH_REPO" --body "$RBODY" || true
            else
              gh issue create --repo "$GH_REPO" \
                --title "release apply failed during catalog publish (run ${GITHUB_RUN_ID})" \
                --body "$RBODY" --label pipeline-alert || true
            fi
          fi
          # notify+close submission issues whose package just landed. Flag the
          # seeds BEFORE commenting (and retry the flag push): a lost flag push
          # would re-notify the same issues next run (C-6). Comments themselves
          # are best-effort — the index is already published.
          if [ -f /tmp/cat/submissions.txt ]; then
            npx tsx pipeline/notify-published.ts /tmp/index.json /tmp/cat/submissions.txt /tmp/stale.list /tmp/dead.list > /tmp/notify.list
            git -C /tmp/cat add submissions.txt
            flagPushed=0
            for i in 1 2 3; do
              if git -C /tmp/cat diff --cached --quiet; then flagPushed=1; break; fi
              git -C /tmp/cat commit -m "submissions: mark notified (run ${GITHUB_RUN_ID})" || true
              git -C /tmp/cat push origin HEAD:catalog && { flagPushed=1; break; }
              git fetch origin catalog 2>/dev/null || true
              git -C /tmp/cat reset --hard origin/catalog 2>/dev/null || true
              npx tsx pipeline/notify-published.ts /tmp/index.json /tmp/cat/submissions.txt /tmp/stale.list /tmp/dead.list > /tmp/notify.list
              git -C /tmp/cat add submissions.txt
            done
            # gate on the flag push: commenting without persisting notified:true
            # means the next run re-marks and re-comments — and a close that
            # races a lost push leaves the seed marked-but-uncommented. When
            # the push fails we skip the whole block; it self-heals next run.
            if [ "$flagPushed" = 1 ]; then
            # issues[] is already deduped per issue inside markNotified — one
            # comment+close per submission no matter how many seed rows match
            sort -un /tmp/notify.list -o /tmp/notify.list
            while read -r N; do
              [ -n "$N" ] || continue
              gh issue comment "$N" --body "✅ 已收录进插件目录（run ${GITHUB_RUN_ID}）。感谢投稿！" || true
              gh issue close "$N" || true
              echo "notified + closed issue #$N"
            done < /tmp/notify.list
            # approved-but-never-landed: seed aged 14d+ without becoming visible.
            # Honest status comment, once per seed (staleWarned flag); the issue
            # is NOT closed — a pipeline-side delay is not author abandonment.
            touch /tmp/stale.list /tmp/dead.list
            while read -r N; do
              [ -n "$N" ] || continue
              gh issue comment "$N" --body "📋 投稿通过初审已超过两周，但条目尚未出现在目录中——可能仍在评审队列，或被收录过滤器拦截。暂不需要你操作；如需跟进请在本 issue 回复。" || true
              echo "stale-warned issue #$N"
            done < /tmp/stale.list
            # dead = terminal: seed aged 30d+ without landing — same horizon as
            # the submit.yml abandonment sweep. Close so approved-but-stuck
            # submissions can't hang open forever (F-11); resubmit = new issue.
            while read -r N; do
              [ -n "$N" ] || continue
              gh issue comment "$N" --body "⌛ 投稿超过 30 天仍未能进入目录（可能在评审队列被拦截或一直未通过评审）。本单视为结束自动关闭——修复后欢迎重新投稿。" || true
              gh issue close "$N" || true
              echo "dead-closed issue #$N"
            done < /tmp/dead.list
            # progress visibility: refresh the pinned status comment on every
            # submission issue that still has a live seed — edit-in-place, one
            # comment per issue, best-effort (never fails the publish).
            GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" GH_REPO="$GH_REPO" \
              npx tsx pipeline/submission-status.ts /tmp/index.json /tmp/cat/submissions.txt || true
            else
              echo "submissions flag push failed — skipping issue notify/close this run (self-heals next run)"
            fi
          fi
      # V-8: site.yml is the single Pages publisher — dispatch it so this push's
      # index lands on the site now instead of at the next scheduled rebuild.
      - name: trigger site rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run site.yml || { sleep 10; gh workflow run site.yml || echo "site dispatch failed twice — the next catalog/verify run will refresh"; }

  alert:
    needs: [generate, publish]
    if: failure()
    runs-on: ubuntu-latest
    permissions: { issues: write }
    steps:
      - name: open failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create pipeline-alert --color d93f0b --force 2>/dev/null || true
          # dedupe (same S-6 pattern as site.yml): a failing streak comments on
          # the one open alert issue instead of opening one per run
          EXISTING=$(gh issue list --repo "$GH_REPO" --label pipeline-alert --state open --search "catalog workflow failed" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GH_REPO" --body "Failed again: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            gh issue create --repo "$GH_REPO" \
              --title "catalog workflow failed (run ${GITHUB_RUN_ID})" \
              --body "Automated alert: the catalog workflow failed."$'\n\n'"Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --label "pipeline-alert"
          fi
