name: verify
on:
  schedule: [{ cron: '47 4 * * *' }, { cron: '47 16 * * *' }]   # 2x/day — aligned behind both catalog runs (WF-4)
  workflow_dispatch:
concurrency: catalog-branch   # shared with catalog.yml — serializes all writers of the catalog branch (I-4)
permissions: {}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { shards: "${{ steps.shards.outputs.list }}" }
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: git fetch origin catalog 2>/dev/null || true
      - run: git show origin/catalog:index.json > /tmp/index.json 2>/dev/null || echo '{"plugins":[]}' > /tmp/index.json
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: shards
        run: |
          node -e '
            const fs = require("fs")
            const idx = JSON.parse(fs.readFileSync("/tmp/index.json","utf8"))
            const todo = idx.plugins.filter(p =>
              p.verification.status === "unverified" && !(p.capabilities.redFlags||[]).length
            ).map(p => p.name)
            const shards = []
            const cap = todo.slice(0, 48)
            for (let i = 0; i < cap.length; i += 12) shards.push(cap.slice(i, i + 12))
            console.log("todo:", todo.length, "shards:", shards.length)
            shards.forEach((s, i) => fs.writeFileSync(`/tmp/shard-${i}.json`, JSON.stringify(s)))
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              `list=${JSON.stringify(shards.map((_, i) => i))}\n`)
          '
      - uses: actions/upload-artifact@v4
        with: { name: shards, path: /tmp/shard-*.json, retention-days: 1 }

  verify:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.shards) != '[]' && fromJSON(needs.plan.outputs.shards) != 'null' }}
    strategy:
      fail-fast: false
      matrix: { shard: "${{ fromJSON(needs.plan.outputs.shards) }}" }
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}                     # untrusted package execution — zero token, zero secrets (DEV §1)
    steps:
      # B-4: eBPF egress allowlist — untrusted plugin code can only reach the
      # registries it needs to install. Covers install AND activation phases.
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            registry.npmjs.org:443
            api.npmjs.org:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm i -g @opencode/cli && opencode --version   # A6-verified v2 install
      - uses: actions/download-artifact@v4
        with: { name: shards, path: /tmp }
      - name: verify shard
        env:
          XDG_CONFIG_HOME: /tmp/vhome/.config
          XDG_DATA_HOME: /tmp/vhome/data
          XDG_CACHE_HOME: /tmp/vhome/cache
        run: npx tsx pipeline/verify/verify.ts /tmp/shard-${{ matrix.shard }}.json /tmp/results-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.shard }}
          path: /tmp/results-${{ matrix.shard }}.json
          retention-days: 7

  merge:
    needs: verify
    runs-on: ubuntu-latest
    permissions: { contents: write, pages: write, id-token: write }    # only job that writes — never executes untrusted code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { pattern: results-*, path: /tmp/results, merge-multiple: true }
      - name: "merge results + commit to catalog (rebase-retry: re-merge against fresh head each attempt, WF-2)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.email "market-bot@users.noreply.github.com"
          git config user.name "market-bot"
          git fetch origin catalog 2>/dev/null || { echo "no catalog branch yet — nothing to merge into"; exit 0; }
          ok=0
          for i in 1 2 3 4; do
            git fetch origin catalog
            git show origin/catalog:index.json > /tmp/index.json
            npx tsx pipeline/verify/merge.ts /tmp/index.json /tmp/results /tmp/index.new.json
            npx tsx pipeline/site/build.ts /tmp/index.new.json /tmp/site
            git checkout -B catalog origin/catalog 2>/dev/null || git checkout -b catalog
            cp /tmp/index.new.json index.json
            git add index.json
            git commit -m "verify: $(date -u +%F) run ${GITHUB_RUN_ID}" || echo "no changes"
            git push origin catalog && { ok=1; break; }
            echo "push rejected (attempt $i) — re-merging against fresh head and retrying"
          done
          [ "$ok" = 1 ] || { echo "verify merge failed after retries"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with: { path: /tmp/site }
      - uses: actions/deploy-pages@v4
        continue-on-error: true

  alert:
    needs: [plan, verify, merge]
    if: failure()
    runs-on: ubuntu-latest
    permissions: { issues: write }
    steps:
      - name: open failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create pipeline-alert --color d93f0b --force 2>/dev/null || true
          gh issue create \
            --title "verify workflow failed (run ${GITHUB_RUN_ID})" \
            --body "Automated alert: the verify workflow failed."$'\n\n'"Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --label "pipeline-alert"
