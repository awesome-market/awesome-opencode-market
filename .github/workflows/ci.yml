name: ci
# scope: prod+fork — checks run in both repos on push/PR
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm --prefix plugins/market ci   # gui-mount tests import plugins/market/src (solid-js et al)
      - run: npx tsc --noEmit
      - run: npm --prefix plugins/market run typecheck   # the client plugin is inside the gate too
      - run: npx vitest run --coverage   # ≥90% thresholds fail the build
