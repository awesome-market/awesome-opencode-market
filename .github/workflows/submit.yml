name: submission-review
# scope: prod-only — formal submission processing + abandonment sweep
on:
  issues: { types: [opened, edited, labeled] }
  issue_comment: { types: [created] }   # re-review loop: author replies after fixing
  schedule: [ { cron: '23 5 * * *' } ]  # abandonment sweep
permissions: {}
jobs:
  review:
    if: >-
      github.event.issue.state == 'open'
      && !github.event.issue.pull_request
      && (contains(github.event.issue.labels.*.name, 'submission') || startsWith(github.event.issue.title, '[submit]'))
      && (github.event_name == 'issues'
          && (github.event.action != 'labeled' || github.event.label.name == 'submission')
          || (github.event_name == 'issue_comment'
              && !endsWith(github.event.comment.user.login, '[bot]')
              && (contains(github.event.issue.labels.*.name || 'x', 'submission:needs-work')
                  || contains(github.event.issue.labels.*.name || 'x', 'submission:invalid')
                  || contains(github.event.issue.labels.*.name || 'x', 'submission:error'))))
    outputs:
      pkg: "${{ steps.parse.outputs.pkg }}"
      verdict: "${{ steps.scan.outputs.v }}"
      subline: "${{ steps.scan.outputs.subline }}"
    runs-on: ubuntu-latest
    concurrency:                       # one review per issue at a time — edited/opened
      group: sub-review-${{ github.event.issue.number }}   # bursts can't double-comment
      cancel-in-progress: true
    # ZERO permissions: review.ts downloads + untars the ATTACKER-CONTROLLED
    # tarball in this job. A tar-parser exploit here must yield nothing —
    # comments/labels happen in the separate `report` job holding issues:write.
    permissions: {}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: parse submission form (+ freeform fallback)
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          npx tsx pipeline/submission.ts > /tmp/sub.json
          PKG=$(node -e "const s=require('/tmp/sub.json');console.log(s.name??'')")
          REPO=$(node -e "const s=require('/tmp/sub.json');console.log(s.repo??'')")
          KIND=$(node -e "const s=require('/tmp/sub.json');console.log(s.kind??'none')")
          echo "pkg=${PKG:-$REPO}" >> "$GITHUB_OUTPUT"     # repo-only skills identify by repo
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
      - name: static review
        id: scan
        env:
          PKG: ${{ steps.parse.outputs.pkg }}
          KIND: ${{ steps.parse.outputs.kind }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENTER: ${{ github.event.comment.user.login || github.event.issue.user.login }}
          COMMENT_ASSOC: ${{ github.event.comment.author_association || '' }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_CREATED: ${{ github.event.issue.created_at }}
        run: |
          # the review records WHICH version it scanned (npm reviewedVersion /
          # repo commit sha); the seed line carries it so a later human verdict
          # lands on the reviewed artifact, not whatever latest is then.
          SEED_VERSION=""; SEED_PKG=""
          if [ "$KIND" = npm ]; then
            npx tsx pipeline/review.ts "$PKG" > /tmp/review.md
            SEED_VERSION=$(grep -oE 'reviewedVersion: [^ ]+' /tmp/review.md | tail -1 | awk '{print $2}')
            if [ "$SEED_VERSION" = "null" ]; then SEED_VERSION=""; fi
          elif [ "$KIND" = repo ]; then
            # repo-only submission: existence + tree evidence gate + codeload
            # scan — same machinery the catalog's github-kind admission runs
            npx tsx pipeline/review.ts --repo "$PKG" > /tmp/review.md
            SEED_VERSION=$(grep -oE 'repoSha: [0-9a-f]+' /tmp/review.md | tail -1 | awk '{print $2}')
            SEED_PKG=$(grep -oE 'repoPkg: [^ ]+' /tmp/review.md | tail -1 | awk '{print $2}')
            if [ "$SEED_PKG" = "null" ]; then SEED_PKG=""; fi
          else
            printf '未能识别包名或仓库地址——请确认表单已填写（issue 编辑后会自动重新审查）。\n\n<!-- verdict: invalid -->\n' > /tmp/review.md
          fi
          [ -s /tmp/review.md ] || { echo "review produced no report"; exit 1; }
          SEED_VERSION="$SEED_VERSION" SEED_PKG="$SEED_PKG" SEED_AUTHOR="$ISSUE_AUTHOR" npx tsx pipeline/submission.ts --seedline "$ISSUE_NUM" > /tmp/sub.line
          { echo 'subline<<SUBLINE_EOF'; cat /tmp/sub.line; echo 'SUBLINE_EOF'; } >> "$GITHUB_OUTPUT"
          # name-squatting guard: a re-review driven by someone other than the
          # issue author can attach the ORIGINAL author's declared metadata to
          # a different package (author deleted, name re-registered). Auto-approve
          # only trusts author-driven iterations — third party forces human review.
          # Collaborators are exempt: they can write verdicts directly anyway, so
          # forcing a flagged round-trip on a maintainer's "please re-review" is
          # pure friction (they ARE the human review).
          if [ "${{ github.event_name }}" = issue_comment ] && [ "$COMMENTER" != "$ISSUE_AUTHOR" ] \
            && ! echo " $COMMENT_ASSOC " | grep -qE ' (OWNER|MEMBER|COLLABORATOR) '; then
            printf '\n\n⚠️ 本次重审由非投稿人 @%s 触发（投稿人 @%s）——包名可能已易主，转人工复核。\n' "$COMMENTER" "$ISSUE_AUTHOR" >> /tmp/review.md
            sed -i 's/<!-- verdict: clean -->/<!-- verdict: flagged -->/' /tmp/review.md
          fi
          # name-age guard: a package/repo registered SHORTLY AFTER an issue that
          # has been open >24h means the name changed hands since submission
          # (legit submit-then-publish resolves within hours). The gap window
          # (0,24h] is the squatting signature — a package appearing DAYS after
          # the issue is far more likely the author's own delayed publish, so
          # slow publishers are not trapped in a permanent flagged loop (F-4).
          if [ "$KIND" != "none" ]; then
            PC=$(grep -oE 'createdAt: [0-9T:.Z-]+' /tmp/review.md | tail -1 | awk '{print $2}')
            if [ -n "$PC" ] && [ "$PC" != "null" ] && PC="$PC" ISSUE_CREATED="$ISSUE_CREATED" node -e "
              const gap = Date.parse(process.env.PC) - Date.parse(process.env.ISSUE_CREATED)
              const age = Date.now() - Date.parse(process.env.ISSUE_CREATED)
              process.exit(gap > 0 && gap <= 86400e3 && age > 86400e3 ? 0 : 1)
            "; then
              printf '\n\n⚠️ 包/仓库在 issue 创建后 24 小时内注册（%s），且 issue 已存在超过 24 小时——名称可能已易主，转人工复核。若这是你自己的延迟发布，请联系 maintainer 人工放行。\n' "$PC" >> /tmp/review.md
              sed -i 's/<!-- verdict: clean -->/<!-- verdict: flagged -->/' /tmp/review.md
            fi
          fi
          # verdict = LAST 'verdict:' occurrence — report body contains
          # package-controlled text (repo url, filenames, matched code) that can
          # inject a fake 'verdict: clean' earlier in the file.
          V=$(grep -oE 'verdict: (clean|flagged|invalid|error)' /tmp/review.md | tail -1 | awk '{print $2}')
          echo "v=${V:-invalid}" >> "$GITHUB_OUTPUT"
      - name: hand report to the privileged comment job
        uses: actions/upload-artifact@v4
        with:
          name: review-md-${{ github.event.issue.number }}
          path: /tmp/review.md
          retention-days: 1
          if-no-files-found: error

  # privileged half of the review: holds issues:write but only reads the
  # artifact the zero-permission `review` job produced — it never parses the
  # attacker tarball itself (N-6 / privilege separation).
  report:
    needs: review
    runs-on: ubuntu-latest
    permissions: { issues: write }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: review-md-${{ github.event.issue.number }}
          path: /tmp
      - name: post review comment (+ next-step guidance)
        uses: actions/github-script@v7
        env:
          VERDICT: ${{ needs.review.outputs.verdict }}
        with:
          script: |
            const fs = require('fs')
            const md = fs.readFileSync('/tmp/review.md','utf8')
            const v = process.env.VERDICT || 'invalid'
            const footer = {
              clean:   '\n\n---\n✅ **初审通过，已加入收录队列**。收录进目录后 bot 会再来评论并关闭本 issue。',
              flagged: '\n\n---\n⚠️ 未通过初审（高危信号或扫描未完成，见上方报告）。修复后**在本 issue 里回复一条评论**即可重新审查；30 天无更新将视为放弃并自动关闭。',
              invalid: '\n\n---\n❌ 未能收录（常见原因：包不存在 / 缺少插件证据）。按上面报告修正后**回复评论**重新审查；30 天无更新将自动关闭。',
              error:   '\n\n---\n🔧 **审查服务暂时不可用**（registry/API 故障，非投稿内容问题）。稍后**回复本 issue 任意评论**即可重新审查；30 天无更新将自动关闭。',
            }[v]
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Automated review\n\n${md}${footer}\n\n_Human maintainer makes the final call._`
            })
      - name: label by verdict (no close — issue closes on actual publish or abandonment)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          V: ${{ needs.review.outputs.verdict }}
        run: |
          gh label create "submission"            --color 0969da -d "plugin submission"   --force 2>/dev/null || true
          gh label create "submission:approved"   --color 0e8a16 -d "review passed"       --force 2>/dev/null || true
          gh label create "submission:needs-work" --color d93f0b -d "red flags present"   --force 2>/dev/null || true
          gh label create "submission:invalid"    --color 6e5494 -d "package not found"   --force 2>/dev/null || true
          gh label create "submission:error"      --color fbca04 -d "review infra failed — retry" --force 2>/dev/null || true
          case "$V" in
            clean)   LBL=submission:approved ;;
            flagged) LBL=submission:needs-work ;;
            error)   LBL=submission:error ;;
            *)       LBL=submission:invalid ;;
          esac
          for L in approved needs-work invalid error; do gh issue edit "$ISSUE" --remove-label "submission:$L" 2>/dev/null || true; done
          gh issue edit "$ISSUE" --add-label "$LBL"

  # approved → append to catalog-branch submissions.txt; catalog.yml --seed picks it up
  ingest:
    needs: review
    if: needs.review.outputs.verdict == 'clean' && needs.review.outputs.subline != ''
    runs-on: ubuntu-latest
    concurrency: catalog-branch        # same writer lock as catalog/verify (I-4)
    permissions: { contents: write, issues: write }
    steps:
      - uses: actions/checkout@v4
      - name: abuse gate — cap open submissions per account, then append
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINE: ${{ needs.review.outputs.subline }}
          AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          # each review costs a runner + tarball scan + a submissions.txt row;
          # without a cap one account can flood the queue. Count OPEN submission
          # issues by this author (excluding this one) — at the cap the clean
          # verdict is reverted so the author isn't told "queued" when it isn't.
          OPEN=$(gh issue list --state open --author "$AUTHOR" --label submission --limit 100 \
            --json number --jq "map(select(.number != $ISSUE)) | length" 2>/dev/null || echo 0)
          if [ "${OPEN:-0}" -ge 5 ]; then
            gh issue edit "$ISSUE" --remove-label submission:approved --add-label submission:needs-work 2>/dev/null || true
            gh issue comment "$ISSUE" --body "⚠️ 投稿已通过机器初审，但暂未入队：你已有 $OPEN 个待处理投稿（上限 5 个）。先等这些投稿审完或撤回，再提交新包。" || true
            echo "author $AUTHOR at open-submission cap ($OPEN) — seed not ingested"
            exit 0
          fi
          KEY=$(node -e "const s=JSON.parse(process.env.LINE);console.log(s.name||s.repo||'')")
          [ -n "$KEY" ] || { echo "empty submission key — skipping"; exit 0; }
          FILE=submissions.txt MSG="submission: $KEY (issue #${{ github.event.issue.number }})" KEY="$KEY" ISSUE="$ISSUE" \
            ./bin/catalog-append.sh

  # dual-channel verdict writeback — a HUMAN applying submission:approved or a
  # collaborator commenting `/approve` / `/concern [reason]` records a
  # source:human verdict in ai-verdicts.jsonl on the catalog branch. Bot-applied
  # labels (sender == github-actions[bot]) don't count: mechanical review is
  # admission-only and never publishes by itself.
  verdict:
    # comment gate is a broad first-letter prefix — the bash command parser
    # below decides ([[:space:]]+ covers tab/newline, case-insensitive); a
    # narrow gate would silently drop `/CONCERN` or `/concern\nreason`, and a
    # non-command comment that slips the prefix exits via skip=1, never as
    # a default verdict
    if: >-
      github.event.issue.state == 'open'
      && !github.event.issue.pull_request
      && (contains(github.event.issue.labels.*.name, 'submission') || startsWith(github.event.issue.title, '[submit]'))
      && (
        (github.event_name == 'issues' && github.event.action == 'labeled'
          && github.event.label.name == 'submission:approved'
          && github.event.sender.login != 'github-actions[bot]')
        || (github.event_name == 'issue_comment' && github.event.action == 'created'
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
          && (startsWith(github.event.comment.body, '/a') || startsWith(github.event.comment.body, '/A')
              || startsWith(github.event.comment.body, '/c') || startsWith(github.event.comment.body, '/C')))
      )
    runs-on: ubuntu-latest
    # per-issue group, NOT catalog-branch: every verdict event must land —
    # a shared writer lock drops pending runs in a burst; the rebase-push
    # retry loop below absorbs cross-issue write races instead. Namespaced per
    # workflow: concern.yml shares the bare `verdict-N` name otherwise (HV-8).
    concurrency: submit-verdict-${{ github.event.issue.number }}
    permissions: { issues: write, contents: write, actions: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: actor gate — labeled events carry no author_association for the labeler
        if: github.event_name == 'issues' && github.event.action == 'labeled'
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          LABEL: ${{ github.event.label.name }}
        run: |
          # Retry once: a transient API failure must not masquerade as a
          # permission denial — a definitive answer (404 = not a collaborator,
          # or an explicit low permission) removes the label; a still-failing
          # check keeps it so the maintainer can re-tap.
          PERM=""
          for t in 1 2; do
            OUT=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission 2>&1) \
              && { PERM="$OUT"; break; }
            case "$OUT" in *"HTTP 404"*) PERM="none"; break ;; esac
            [ "$t" = 1 ] && sleep 2
          done
          echo "actor=$ACTOR permission=${PERM:-unknown}"
          case "$PERM" in
            admin|maintain|write) echo "allowed=1" >> "$GITHUB_OUTPUT" ;;
            none|read|triage)
               gh issue edit "$ISSUE" -R "$REPO" --remove-label "$LABEL" || true
               gh issue comment "$ISSUE" -R "$REPO" --body "⛔ @$ACTOR 无裁决权限（${PERM:-unknown}）——标签已移除。仅 maintainer 可用 verdict 标签。" || true
               echo "allowed=0" >> "$GITHUB_OUTPUT" ;;
            *)
               gh issue comment "$ISSUE" -R "$REPO" --body "⚠️ 无法确认 @$ACTOR 的仓库权限（API 暂时不可用）——标签已保留，请稍后重试。" || true
               echo "allowed=0" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: parse submission + resolve verdict record
        if: steps.gate.outputs.allowed != '0'
        id: v
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: |
          npx tsx pipeline/submission.ts > /tmp/sub.json
          NAME=$(node -e "const s=require('/tmp/sub.json');console.log(s.name??'')")
          REPO=$(node -e "const s=require('/tmp/sub.json');console.log(s.repo??'')")
          KIND=$(node -e "const s=require('/tmp/sub.json');console.log(s.kind??'none')")
          # command parse — [[:space:]] covers tab/newline, ${,,} covers case;
          # anything else on a widened gate must SKIP, never fall through to
          # a default verdict (the old VERDICT=pass default would turn any
          # `/c*` or `/a*` comment into an approval)
          VERDICT=""; REASON=""
          if [ "$EVENT" = "issue_comment" ]; then
            LOW=${COMMENT_BODY,,}
            if [[ "$LOW" =~ ^/concern([[:space:]]|$) ]]; then
              VERDICT=concern
              REASON=$(printf '%s' "$COMMENT_BODY" | sed -E 's|^/concern[[:space:]]*||I')
            elif [[ "$LOW" =~ ^/approve([[:space:]]|$) ]]; then
              VERDICT=pass
              REASON=$(printf '%s' "$COMMENT_BODY" | sed -E 's|^/approve[[:space:]]*||I')
            else
              echo "not a verdict command — skip"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
            fi
          else
            VERDICT=pass   # labeled submission:approved
          fi
          # reason → single-line audit text (multiline would break the digest
          # table + dedupe compare); code-point slice, not byte truncate
          REASON=$(printf '%s' "$REASON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{console.log([...s.replace(/\s+/g," ").trim()].slice(0,2000).join(""))})')
          # repo-only submissions identify by repo as the entry name
          ENTRY="${NAME:-$REPO}"
          [ -n "$ENTRY" ] || { echo "no parseable submission — skip"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; }
          # H-18: on a [submit] issue the verdict always lands on THE SUBMITTED
          # package — command args are never a retarget. An arg token that
          # looks like a DIFFERENT spec (foo@ver or owner/repo) means the
          # maintainer probably meant to judge that package — flag it so the
          # ack can warn instead of silently writing to the wrong target.
          # spec-like = name[@ver] or owner/repo — but NOT file paths
          # (src/index.js), URLs, or bare @mentions, which are common reason
          # text and must not false-positive the argignored warning (F-10c).
          # Final gate: the spec must name a REAL catalog entry — prose like
          # "and/or" is charset-shaped but matches no package.
          TOK=$(printf '%s' "$REASON" | awk '{print $1}')
          SPEC_TOK=$(printf '%s' "$TOK" | node -e '
            let t="";process.stdin.on("data",d=>t+=d).on("end",()=>{
              t=t.trim()
              const file=/\.(js|ts|tsx|jsx|mjs|cjs|json|md|markdown|txt|ya?ml|toml|sh|bash|py|go|rs|java|c|cc|cpp|h|css|scss|html?|png|jpe?g|gif|svg|webp|zip|tar|gz|rar|7z|lock)$/i.test(t)
              const mention=/^@[A-Za-z0-9-]+$/.test(t)
              const charset=/^@?[A-Za-z0-9][A-Za-z0-9._-]*(\/[A-Za-z0-9][A-Za-z0-9._-]*)?(@[A-Za-z0-9][A-Za-z0-9._-]*)?$/.test(t)
              const specy=charset&&!file&&!mention&&(t.includes("/")||/@/.test(t.slice(1)))
              process.stdout.write(specy?t:"")
            })')
          # version+sha: pin to the version the BOT REVIEWED (recorded on the
          # seed line at ingest), not approve-time dist-tags.latest — a human
          # pass must release the artifact that was actually scanned. npm moved
          # in between → the verdict keys to the reviewed version and the newer
          # one goes through its own review (held-version semantics). The LAST
          # matching seed wins: re-reviews append new lines and the newest
          # reviewedVersion is the current intent (F-5).
          VER=""; SHA=""; NOSEED=""
          git fetch origin catalog --quiet 2>/dev/null || true
          export SUB_NAME="$NAME" SUB_REPO="$REPO"
          SEED=$(git show FETCH_HEAD:submissions.txt 2>/dev/null | node -e '
            const i=require("fs").readFileSync(0,"utf8")
            const n=process.env.SUB_NAME||"", r=process.env.SUB_REPO||""
            let hit=null
            for(const l of i.split("\n")){try{const s=JSON.parse(l)
              if(n&&s.name===n)hit=s;else if(!n&&r&&s.repo===r)hit=s}catch{}}
            if(hit)console.log(JSON.stringify(hit))' || true)
          git show FETCH_HEAD:index.json > /tmp/index.json 2>/dev/null || true
          # argignored: only when the spec token names a DIFFERENT catalog
          # entry — a spec-shaped word that is no package ("and/or") is reason
          # prose, not a cross-target attempt
          if [ -n "$SPEC_TOK" ] && [ -s /tmp/index.json ]; then
            TOKNAME=$(node -e 'const s=process.argv[1];const at=s.lastIndexOf("@");console.log(at>0?s.slice(0,at):s)' "$SPEC_TOK")
            if [ "$TOKNAME" != "$ENTRY" ] && node -e 'const i=JSON.parse(require("fs").readFileSync("/tmp/index.json","utf8"));process.exit(i.plugins.some(p=>p.name===process.argv[1])?0:1)' "$TOKNAME"; then
              echo "argignored=$SPEC_TOK" >> "$GITHUB_OUTPUT"
            fi
          fi
          if [ "$KIND" = npm ] && [ -n "$NAME" ]; then
            CUR=$(npm view "$NAME" version 2>/dev/null || true)
            if [ -n "$SEED" ]; then
              VER=$(node -e "console.log(JSON.parse(process.argv[1]).version||'')" "$SEED")
              # legacy seed line without a version field → latest is the only
              # resolvable target (pre-versioning submissions)
              [ -z "$VER" ] && VER="$CUR"
              if [ -n "$CUR" ] && [ "$CUR" != "$VER" ]; then
                echo "vermismatch=$VER->$CUR" >> "$GITHUB_OUTPUT"
              fi
            elif [ "$VERDICT" = pass ]; then
              # F-3: never let a human pass land on bytes nobody scanned —
              # without a reviewed seed there is no version to pin, so the
              # verdict is refused and the maintainer is told to wait for the
              # bot review (or use the [concern] form which resolves index-side)
              NOSEED=1
              VER="$CUR"
            else
              # concern is a brake — pinning current latest is the safe
              # direction even without a reviewed seed; an unresolvable
              # version would write a verdict that matches no catalog slot
              VER="$CUR"
              [ -z "$VER" ] && NOSEED=1
            fi
            [ -n "$VER" ] && for t in 1 2 3; do
              SHA=$(npm view "$NAME@$VER" dist.integrity 2>/dev/null || true)
              [ -n "$SHA" ] && break
              [ "$t" -lt 3 ] && sleep 2
            done
          fi
          [ -n "$NOSEED" ] && echo "noseed=1" >> "$GITHUB_OUTPUT"
          # Semantic dedupe (HV-2) + reason-only amend BEFORE the record —
          # identical re-runs are no-ops; a reason-only change reuses the
          # prior line's `at` so digest maturity isn't restarted by an edit
          git show origin/catalog:ai-verdicts.jsonl > /tmp/av.jsonl 2>/dev/null || touch /tmp/av.jsonl
          DEDUPE=$(npx tsx pipeline/human-verdict.ts dedupe /tmp/av.jsonl "$ENTRY" "$VER" "$VERDICT" "$REASON")
          printf '%s\n' "$DEDUPE" >> "$GITHUB_OUTPUT"
          AMEND=$(printf '%s\n' "$DEDUPE" | sed -n 's/^amend=//p')
          DUP=$(printf '%s\n' "$DEDUPE" | sed -n 's/^dup=//p')
          node -e '
            const rec = {
              name: process.argv[1],
              version: process.argv[2] || null,
              verdict: process.argv[3],
              ...(process.argv[4] ? { reason: process.argv[4] } : {}),
              // amend: reason-only edit — reuse the prior line's timestamp
              at: process.argv[8] || new Date().toISOString(),
              source: "human",
              ...(process.argv[5] ? { sha: process.argv[5] } : {}),
              by: process.argv[6],
              issue: Number(process.argv[7]),
            }
            console.log(JSON.stringify(rec))
          ' "$ENTRY" "$VER" "$VERDICT" "$REASON" "$SHA" "$ACTOR" "$ISSUE_NUM" "$AMEND" > /tmp/verdict.line
          cat /tmp/verdict.line
          [ "$DUP" != "1" ] && echo "line=$(cat /tmp/verdict.line)" >> "$GITHUB_OUTPUT"
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "target=$ENTRY${VER:+@$VER}" >> "$GITHUB_OUTPUT"
      - name: append verdict + apply to index.json on catalog branch
        if: steps.gate.outputs.allowed != '0' && steps.v.outputs.skip != '1' && steps.v.outputs.dup != '1' && steps.v.outputs.noseed != '1'
        id: app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE: ai-verdicts.jsonl
          LINE: ${{ steps.v.outputs.line }}
          MSG: "verdict: human ${{ steps.v.outputs.verdict }} ${{ steps.v.outputs.target }} (issue #${{ github.event.issue.number }})"
          APPLY_INDEX: "1"
          STATUS_FILE: /tmp/apply-status
        run: |
          ./bin/catalog-append.sh
          echo "apply=$(cat /tmp/apply-status 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"
      - name: dispatch site rebuild — a brake only counts once the public index shows it
        if: steps.gate.outputs.allowed != '0' && steps.v.outputs.skip != '1' && steps.v.outputs.dup != '1' && steps.v.outputs.noseed != '1' && steps.v.outputs.verdict == 'concern' && steps.app.outputs.apply != 'degraded'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # A concern brakes immediately via APPLY_INDEX — but the PUBLIC site
          # index only refreshes on dispatch/schedule; without this a braked
          # submission stays listed as before for up to ~16h (HV-1).
          gh workflow run site.yml -R "$REPO" || { sleep 10; gh workflow run site.yml -R "$REPO" || {
            # a brake that can't reach the site is the worst silent failure —
            # escalate to a deduped alert instead of waiting for the digest
            # watchdog's 36h leg (HV-1 is minute-scale by intent)
            echo "::warning::site dispatch failed twice — escalating to pipeline-alert"
            gh label create pipeline-alert --color d93f0b --force 2>/dev/null || true
            EX=$(gh issue list -R "$REPO" --label pipeline-alert --state open --search "site dispatch failed in:title" --json number --jq '.[0].number' 2>/dev/null || true)
            BODY="site.yml dispatch failed twice — a concern/brake may stay stale on the public site until the next catalog/verify dispatch or a manual \`gh workflow run site.yml\`. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [ -n "$EX" ]; then gh issue comment "$EX" -R "$REPO" --body "$BODY" || true
            else gh issue create -R "$REPO" --title "site dispatch failed (run ${GITHUB_RUN_ID})" --body "$BODY" --label pipeline-alert || true; fi
          }; }
      - name: acknowledge on issue
        if: steps.gate.outputs.allowed != '0' && steps.v.outputs.skip != '1'
        uses: actions/github-script@v7
        env:
          V: ${{ steps.v.outputs.verdict }}
          TARGET: ${{ steps.v.outputs.target }}
          ARGIGNORED: ${{ steps.v.outputs.argignored }}
          VERMISMATCH: ${{ steps.v.outputs.vermismatch }}
          DUP: ${{ steps.v.outputs.dup }}
          NOSEED: ${{ steps.v.outputs.noseed }}
          APPLY: ${{ steps.app.outputs.apply }}
        with:
          script: |
            let msg = process.env.V === 'concern'
              ? `⚠️ 已记录人工 concern（${process.env.TARGET}）——该版本的发布已被阻断，记录可在 catalog 分支 ai-verdicts.jsonl 审计。`
              : `✅ 已记录人工 pass（${process.env.TARGET}）——将在下次日报公示后进入上架流程，记录可在 catalog 分支 ai-verdicts.jsonl 审计。`
            // the comment carried a spec for a DIFFERENT package — on a submit
            // issue the verdict always lands on the submission itself; say so
            // instead of silently writing to the wrong-looking target (H-18)
            if (process.env.ARGIGNORED)
              msg += `\n\n注意：评论里的 \`${process.env.ARGIGNORED}\` 被忽略——本单裁决只作用于投稿包。要裁决其他包，请在对应 [review] 单操作或开 [concern] 表单。`
            // npm published since the bot scanned — the verdict deliberately
            // keys to the REVIEWED version; the newer one needs its own review
            if (process.env.VERMISMATCH)
              msg += `\n\n注意：裁决钉在初审扫描的版本 ${process.env.VERMISMATCH.split('->')[0]}；npm 现已发布 ${process.env.VERMISMATCH.split('->')[1]}——新版本上架前需要自己的审查（初审评论里可查看当时扫描详情）。`
            // F-3: a pass with no reviewed seed is refused — approving bytes
            // nobody scanned would break the "human pass only releases what
            // the bot reviewed" invariant
            if (process.env.NOSEED === '1' && process.env.V === 'pass')
              msg = `⛔ 未记录裁决：本投稿尚未通过机器初审入库，找不到已审版本可钉定——**人工 pass 不能放行从未扫描过的包**。请等初审完成（或先按初审报告修复）后再 `/approve`；如需直接裁决请走 [concern] 表单显式指定版本。`
            else if (process.env.NOSEED === '1')
              msg += `\n\n注意：未找到初审种子行，裁决按当前 npm latest 记录——若该版本之后有更新，需重新裁决。`
            // identical verdict already on file — append skipped so the
            // original `at` (and its maturity window) stands (HV-2)
            if (process.env.DUP === '1')
              msg += `\n\n相同裁决已在记录中——本次未重复追加（保留原裁决时间与成熟度窗口）。`
            // verdict line landed but index.json was NOT folded — recorded
            // yet publicly stale until the next catalog run; don't pretend
            if (process.env.APPLY === 'degraded')
              msg += `\n\n⚠️ index 应用降级——裁决已存档，但 index.json 未能同步更新：公开站点/客户端在下次 catalog 班（约 16h）前仍显示旧状态。重新触发同一命令可重试应用（幂等）。`
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body: msg })
            // a human concern is terminal for this submission round — leaving
            // the issue open reads as "still under review" (F-11). The author
            // can fix and resubmit (or reopen) once the concern is addressed.
            if (process.env.V === 'concern' && process.env.NOSEED !== '1')
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, state: 'closed' })
      - name: write-failure feedback
        # a failed append otherwise leaves the issue silent while the
        # maintainer believes the verdict landed (HV-3)
        if: failure() && steps.gate.outputs.allowed != '0' && steps.v.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --body "⚠️ 裁决流程失败——verdict **可能未落盘**（ai-verdicts.jsonl 无记录）。失败详情见 run：$RUN_URL ——修复后重新触发同一标签/命令即可重试。" || true

  sweep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions: { issues: write }
    steps:
      - name: close stale submission issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # --limit must exceed the label's plausible backlog or the oldest
          # issues starve forever once the queue grows past one page (F-11)
          for LBL in submission:invalid submission:needs-work submission:error; do
            gh issue list --label "$LBL" --state open --limit 1000 --json number,updatedAt |
              node -e "const i=require('fs').readFileSync(0,'utf8');const cut=Date.now()-30*86400e3;JSON.parse(i).filter(x=>Date.parse(x.updatedAt)<cut).forEach(x=>console.log(x.number))" |
              while read -r N; do
                gh issue comment "$N" --body "30 天没有新动态，视为放弃投稿，自动关闭。修复完成后欢迎重新开 issue 投稿。" || true
                gh issue close "$N" || true
                echo "closed abandoned issue #$N"
              done
          done

  # author-initiated withdrawal: /withdraw by the issue author (or a
  # collaborator) removes this issue's seed rows from submissions.txt so the
  # package never enters the catalog. Already-published entries are NOT
  # touched — taking those down is a maintainer verdict, not self-service.
  withdraw:
    if: >-
      github.event_name == 'issue_comment'
      && github.event.action == 'created'
      && github.event.issue.state == 'open'
      && !github.event.issue.pull_request
      && (contains(github.event.issue.labels.*.name, 'submission') || startsWith(github.event.issue.title, '[submit]'))
      && (startsWith(github.event.comment.body, '/w') || startsWith(github.event.comment.body, '/W'))
      && (github.event.comment.user.login == github.event.issue.user.login
          || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    concurrency: catalog-branch        # same writer lock as ingest/verify
    permissions: { contents: write, issues: write }
    steps:
      - uses: actions/checkout@v4
      - name: remove seeds + close the issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # the gate is a broad first-letter prefix — withdraw is destructive,
          # so validate the real command shape here before touching seeds
          LOW=${COMMENT_BODY,,}
          [[ "$LOW" =~ ^/withdraw([[:space:]]|$) ]] || { echo "not a withdraw command — skip"; exit 0; }
          if ISSUE="$ISSUE" MSG="submission withdrawn (issue #$ISSUE)" ./bin/catalog-withdraw.sh; then
            gh issue comment "$ISSUE" --body "↩️ 已撤回投稿——收录队列中本单的种子已移除，不会再进入目录。如条目此前已上架，撤回不影响已发布内容（下架需 maintainer 操作）。感谢使用！"
            gh issue close "$ISSUE"
          else
            gh issue comment "$ISSUE" --body "⚠️ 撤回失败——收录队列写入重试耗尽，种子可能仍在队列中。失败详情：$RUN_URL ——稍后可再次评论 /withdraw 重试。"
          fi

  # F-6: review/report/ingest failures were silent — the issue hung forever
  # (sweep only watches verdict labels). Surface the failure on the issue
  # itself; a comment re-triggers review once the infra recovers.
  review-alert:
    needs: [review, report, ingest]
    if: ${{ failure() && github.event.issue.number }}
    runs-on: ubuntu-latest
    permissions: { issues: write }
    steps:
      - name: report pipeline failure on the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --body "⚠️ 投稿处理流程失败——本次审查/入库**可能未完成**（机器审查结果未知，不代表投稿内容有问题）。失败详情：$RUN_URL ——修复后在本 issue 回复任意评论即可重新触发审查。" || true
