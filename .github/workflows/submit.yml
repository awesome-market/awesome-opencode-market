name: submission-review
on:
  issues: { types: [opened, edited, labeled] }
  issue_comment: { types: [created] }   # re-review loop: author replies after fixing
  schedule: [ { cron: '23 5 * * *' } ]  # abandonment sweep
permissions: {}
jobs:
  review:
    if: >-
      github.event.issue.state == 'open'
      && !github.event.issue.pull_request
      && (contains(github.event.issue.labels.*.name, 'submission') || startsWith(github.event.issue.title, '[submit]'))
      && (github.event_name == 'issues'
          || (github.event_name == 'issue_comment'
              && !endsWith(github.event.comment.user.login, '[bot]')
              && (contains(github.event.issue.labels.*.name || 'x', 'submission:needs-work')
                  || contains(github.event.issue.labels.*.name || 'x', 'submission:invalid'))))
    outputs:
      pkg: "${{ steps.parse.outputs.pkg }}"
      verdict: "${{ steps.scan.outputs.v }}"
      subline: "${{ steps.parse.outputs.subline }}"
    runs-on: ubuntu-latest
    concurrency:                       # one review per issue at a time — edited/opened
      group: sub-review-${{ github.event.issue.number }}   # bursts can't double-comment
      cancel-in-progress: true
    permissions: { issues: write }     # comments/labels only; pipeline runs here but executes no plugin code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: parse submission form (+ freeform fallback)
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          npx tsx pipeline/submission.ts > /tmp/sub.json
          npx tsx pipeline/submission.ts --seedline "$ISSUE_NUM" > /tmp/sub.line
          PKG=$(node -e "const s=require('/tmp/sub.json');console.log(s.name??'')")
          REPO=$(node -e "const s=require('/tmp/sub.json');console.log(s.repo??'')")
          KIND=$(node -e "const s=require('/tmp/sub.json');console.log(s.kind??'none')")
          echo "pkg=${PKG:-$REPO}" >> "$GITHUB_OUTPUT"     # repo-only skills identify by repo
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "subline=$(cat /tmp/sub.line)" >> "$GITHUB_OUTPUT"
      - name: static review
        id: scan
        env:
          PKG: ${{ steps.parse.outputs.pkg }}
          KIND: ${{ steps.parse.outputs.kind }}
          COMMENTER: ${{ github.event.comment.user.login || github.event.issue.user.login }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_CREATED: ${{ github.event.issue.created_at }}
        run: |
          if [ "$KIND" = npm ]; then
            npx tsx pipeline/review.ts "$PKG" > /tmp/review.md
          elif [ "$KIND" = repo ]; then
            # repo-only submission: no npm package to scan — honest verdict
            printf 'GitHub-only 提交（%s）：未做 npm 扫描，目录按仓库条目收录。\n\n<!-- verdict: clean -->\n' "$PKG" > /tmp/review.md
          else
            printf '未能识别包名或仓库地址——请确认表单已填写（issue 编辑后会自动重新审查）。\n\n<!-- verdict: invalid -->\n' > /tmp/review.md
          fi
          [ -s /tmp/review.md ] || { echo "review produced no report"; exit 1; }
          # name-squatting guard: a re-review driven by someone other than the
          # issue author can attach the ORIGINAL author's declared metadata to
          # a different package (author deleted, name re-registered). Auto-approve
          # only trusts author-driven iterations — third party forces human review.
          if [ "${{ github.event_name }}" = issue_comment ] && [ "$COMMENTER" != "$ISSUE_AUTHOR" ]; then
            printf '\n\n⚠️ 本次重审由非投稿人 @%s 触发（投稿人 @%s）——包名可能已易主，转人工复核。\n' "$COMMENTER" "$ISSUE_AUTHOR" >> /tmp/review.md
            sed -i 's/<!-- verdict: clean -->/<!-- verdict: flagged -->/' /tmp/review.md
          fi
          # name-age guard: package registered AFTER an issue that has been open
          # >24h means the name changed hands since submission (legit
          # submit-then-publish resolves within hours). Catches author-driven
          # re-review of a squatted name too.
          if [ "$KIND" = npm ]; then
            PC=$(grep -oE 'createdAt: [0-9T:.Z-]+' /tmp/review.md | tail -1 | awk '{print $2}')
            if [ -n "$PC" ] && [ "$PC" != "null" ] && PC="$PC" node -e "process.exit(Date.parse(process.env.PC) > Date.parse(process.env.ISSUE_CREATED) && Date.now() - Date.parse(process.env.ISSUE_CREATED) > 86400e3 ? 0 : 1)"; then
              printf '\n\n⚠️ 包名在 issue 创建之后才注册（%s），且 issue 已存在超过 24 小时——名称可能已易主，转人工复核。\n' "$PC" >> /tmp/review.md
              sed -i 's/<!-- verdict: clean -->/<!-- verdict: flagged -->/' /tmp/review.md
            fi
          fi
          # verdict = LAST 'verdict:' occurrence — report body contains
          # package-controlled text (repo url, filenames, matched code) that can
          # inject a fake 'verdict: clean' earlier in the file.
          V=$(grep -oE 'verdict: (clean|flagged|invalid)' /tmp/review.md | tail -1 | awk '{print $2}')
          echo "v=${V:-invalid}" >> "$GITHUB_OUTPUT"
      - name: post review comment (+ next-step guidance)
        uses: actions/github-script@v7
        env:
          VERDICT: ${{ steps.scan.outputs.v }}
        with:
          script: |
            const fs = require('fs')
            const md = fs.readFileSync('/tmp/review.md','utf8')
            const v = process.env.VERDICT || 'invalid'
            const footer = {
              clean:   '\n\n---\n✅ **初审通过，已加入收录队列**。收录进目录后 bot 会再来评论并关闭本 issue。',
              flagged: '\n\n---\n⚠️ 发现高危信号。修复后**在本 issue 里回复一条评论**即可重新审查；30 天无更新将视为放弃并自动关闭。',
              invalid: '\n\n---\n❌ 未能收录（常见原因：包不存在 / 缺少插件证据）。按上面报告修正后**回复评论**重新审查；30 天无更新将自动关闭。',
            }[v]
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Automated review\n\n${md}${footer}\n\n_Human maintainer makes the final call._`
            })
      - name: label by verdict (no close — issue closes on actual publish or abandonment)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          V: ${{ steps.scan.outputs.v }}
        run: |
          gh label create "submission"            --color 0969da -d "plugin submission"   --force 2>/dev/null || true
          gh label create "submission:approved"   --color 0e8a16 -d "review passed"       --force 2>/dev/null || true
          gh label create "submission:needs-work" --color d93f0b -d "red flags present"   --force 2>/dev/null || true
          gh label create "submission:invalid"    --color 6e5494 -d "package not found"   --force 2>/dev/null || true
          case "$V" in
            clean)   LBL=submission:approved ;;
            flagged) LBL=submission:needs-work ;;
            *)       LBL=submission:invalid ;;
          esac
          for L in approved needs-work invalid; do gh issue edit "$ISSUE" --remove-label "submission:$L" 2>/dev/null || true; done
          gh issue edit "$ISSUE" --add-label "$LBL"

  # approved → append to catalog-branch submissions.txt; catalog.yml --seed picks it up
  ingest:
    needs: review
    if: needs.review.outputs.verdict == 'clean' && needs.review.outputs.subline != ''
    runs-on: ubuntu-latest
    concurrency: catalog-branch        # same writer lock as catalog/verify (I-4)
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: append to submissions.txt on catalog branch (dedupe by name/repo)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINE: ${{ needs.review.outputs.subline }}
        run: |
          git config user.email "market-bot@users.noreply.github.com"
          git config user.name "market-bot"
          KEY=$(node -e "const s=JSON.parse(process.env.LINE);console.log(s.name||s.repo||'')")
          [ -n "$KEY" ] || { echo "empty submission key — skipping"; exit 0; }
          PUSHED=
          for i in 1 2 3; do
            # catalog branch MUST come from origin — never fabricate it from the
            # main checkout (would push the whole source tree into the data branch)
            git fetch origin catalog || { echo "attempt $i: fetch failed"; sleep 3; continue; }
            git checkout -B catalog origin/catalog || { echo "attempt $i: no origin/catalog"; sleep 3; continue; }
            touch submissions.txt
            # exact-match dedupe: serialized lines are {"name":"x","repo":...} — the
            # comma anchor prevents substring false-positives (o/repo vs o/repo-x)
            grep -qF "\"name\":\"$KEY\"," submissions.txt || grep -qF "\"repo\":\"$KEY\"," submissions.txt || echo "$LINE" >> submissions.txt
            git add submissions.txt
            git commit -m "submission: $KEY (issue #${{ github.event.issue.number }})" || { echo "no changes"; PUSHED=1; break; }
            git push origin catalog && { PUSHED=1; break; }
            echo "push rejected (attempt $i) — retrying"
            sleep 3
          done
          [ -n "$PUSHED" ] || { echo "failed to land submission after 3 attempts"; exit 1; }

  # dual-channel verdict writeback — a HUMAN applying submission:approved or a
  # collaborator commenting `/approve` / `/concern [reason]` records a
  # source:human verdict in ai-verdicts.jsonl on the catalog branch. Bot-applied
  # labels (sender == github-actions[bot]) don't count: mechanical review is
  # admission-only and never publishes by itself.
  verdict:
    if: >-
      github.event.issue.state == 'open'
      && !github.event.issue.pull_request
      && (contains(github.event.issue.labels.*.name, 'submission') || startsWith(github.event.issue.title, '[submit]')
          || github.event.label.name == 'submission:approved')
      && (
        (github.event_name == 'issues' && github.event.action == 'labeled'
          && github.event.label.name == 'submission:approved'
          && github.event.sender.login != 'github-actions[bot]')
        || (github.event_name == 'issue_comment' && github.event.action == 'created'
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
          && (startsWith(github.event.comment.body, '/approve') || startsWith(github.event.comment.body, '/concern')))
      )
    runs-on: ubuntu-latest
    concurrency: catalog-branch        # same writer lock as ingest/catalog/verify
    permissions: { issues: write, contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: parse submission + resolve verdict record
        id: v
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          npx tsx pipeline/submission.ts > /tmp/sub.json
          NAME=$(node -e "const s=require('/tmp/sub.json');console.log(s.name??'')")
          REPO=$(node -e "const s=require('/tmp/sub.json');console.log(s.repo??'')")
          KIND=$(node -e "const s=require('/tmp/sub.json');console.log(s.kind??'none')")
          VERDICT=pass; REASON=""
          if [[ "$COMMENT_BODY" == /concern* ]]; then
            VERDICT=concern
            REASON=$(printf '%s' "$COMMENT_BODY" | sed 's|^/concern\s*||' | head -c 2000)
          elif [[ "$COMMENT_BODY" == /approve* ]]; then
            VERDICT=pass
            REASON=$(printf '%s' "$COMMENT_BODY" | sed 's|^/approve\s*||' | head -c 2000)
          fi
          # version+sha: latest npm version at approve-time for npm submissions;
          # null for repo-only (github-kind) entries. sha is best-effort so a
          # registry blip doesn't block a human decision.
          VER=""; SHA=""
          if [ "$KIND" = npm ] && [ -n "$NAME" ]; then
            VER=$(npm view "$NAME" version 2>/dev/null || true)
            [ -n "$VER" ] && SHA=$(npm view "$NAME@$VER" dist.integrity 2>/dev/null || true)
          fi
          # repo-only submissions identify by repo as the entry name
          ENTRY="${NAME:-$REPO}"
          [ -n "$ENTRY" ] || { echo "no parseable submission — skip"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; }
          node -e '
            const rec = {
              name: process.argv[1],
              version: process.argv[2] || null,
              verdict: process.argv[3],
              ...(process.argv[4] ? { reason: process.argv[4] } : {}),
              at: new Date().toISOString(),
              source: "human",
              ...(process.argv[5] ? { sha: process.argv[5] } : {}),
            }
            console.log(JSON.stringify(rec))
          ' "$ENTRY" "$VER" "$VERDICT" "$REASON" "$SHA" > /tmp/verdict.line
          cat /tmp/verdict.line
          echo "line=$(cat /tmp/verdict.line)" >> "$GITHUB_OUTPUT"
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "target=$ENTRY${VER:+@$VER}" >> "$GITHUB_OUTPUT"
      - name: append to ai-verdicts.jsonl on catalog branch
        if: steps.v.outputs.skip != '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINE: ${{ steps.v.outputs.line }}
        run: |
          git config user.email "market-bot@users.noreply.github.com"
          git config user.name "market-bot"
          PUSHED=
          for i in 1 2 3; do
            git fetch origin catalog || { echo "attempt $i: fetch failed"; sleep 3; continue; }
            git checkout -B catalog origin/catalog || { echo "attempt $i: no origin/catalog"; sleep 3; continue; }
            touch ai-verdicts.jsonl
            echo "$LINE" >> ai-verdicts.jsonl
            git add ai-verdicts.jsonl
            git commit -m "verdict: human ${{ steps.v.outputs.verdict }} ${{ steps.v.outputs.target }} (issue #${{ github.event.issue.number }})" || { echo "no changes"; PUSHED=1; break; }
            git push origin catalog && { PUSHED=1; break; }
            echo "push rejected (attempt $i) — retrying"
            sleep 3
          done
          [ -n "$PUSHED" ] || { echo "failed to land verdict after 3 attempts"; exit 1; }
      - name: acknowledge on issue
        if: steps.v.outputs.skip != '1'
        uses: actions/github-script@v7
        env:
          V: ${{ steps.v.outputs.verdict }}
          TARGET: ${{ steps.v.outputs.target }}
        with:
          script: |
            const msg = process.env.V === 'concern'
              ? `⚠️ 已记录人工 concern（${process.env.TARGET}）——该版本的发布已被阻断，记录可在 catalog 分支 ai-verdicts.jsonl 审计。`
              : `✅ 已记录人工 pass（${process.env.TARGET}）——将在下次日报公示后进入上架流程，记录可在 catalog 分支 ai-verdicts.jsonl 审计。`
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body: msg })

  sweep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions: { issues: write }
    steps:
      - name: close stale submission issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          for LBL in submission:invalid submission:needs-work; do
            gh issue list --label "$LBL" --state open --limit 200 --json number,updatedAt |
              node -e "const i=require('fs').readFileSync(0,'utf8');const cut=Date.now()-30*86400e3;JSON.parse(i).filter(x=>Date.parse(x.updatedAt)<cut).forEach(x=>console.log(x.number))" |
              while read -r N; do
                gh issue comment "$N" --body "30 天没有新动态，视为放弃投稿，自动关闭。修复完成后欢迎重新开 issue 投稿。" || true
                gh issue close "$N" || true
                echo "closed abandoned issue #$N"
              done
          done
